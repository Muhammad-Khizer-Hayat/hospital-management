<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#0a1628">
<title>Doctor Dashboard – MediCare+</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#0a1628;--blue:#2563eb;--teal:#0d9488;--bg:#f1f5f9;--text:#1e293b;--muted:#64748b;--border:#e2e8f0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}
.layout{display:flex;min-height:100vh}
.side{width:250px;background:var(--navy);color:#fff;flex-shrink:0;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:.7rem;padding:1.4rem 1.4rem 1.2rem;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .ic{width:40px;height:40px;border-radius:11px;overflow:hidden;flex-shrink:0}
.brand b{font-family:'Playfair Display',serif;font-size:1.25rem;display:block;line-height:1.1}.brand small{font-size:.62rem;letter-spacing:.14em;color:#7f90ad;text-transform:uppercase}
.who{padding:1.1rem 1.4rem;border-bottom:1px solid rgba(255,255,255,.08)}.who b{display:block;font-size:.95rem}.who span{font-size:.78rem;color:#7f90ad}
nav{padding:.7rem 0;flex:1}
.nl{display:flex;gap:.8rem;align-items:center;padding:.75rem 1.4rem;color:#94a3b8;cursor:pointer;font-size:.9rem;font-weight:500;border-left:3px solid transparent}
.nl:hover{background:rgba(255,255,255,.05);color:#fff}.nl.active{background:rgba(37,99,235,.18);color:#93c5fd;border-left-color:#3b82f6}
.out{padding:1rem 1.4rem;border-top:1px solid rgba(255,255,255,.08);font-size:.85rem;color:#f87171;cursor:pointer}
.main{flex:1;min-width:0}
.top{background:#fff;padding:1rem 2rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.top h2{font-size:1.15rem}
.content{padding:1.75rem 2rem}
.btn{border:0;border-radius:9px;padding:.55rem 1rem;font:600 .85rem 'DM Sans',sans-serif;cursor:pointer;background:#fff;color:var(--text);border:1.5px solid var(--border)}
.btn:hover{border-color:var(--blue)}.btn-p{background:var(--blue);color:#fff;border-color:var(--blue)}.btn-g{background:#16a34a;color:#fff;border-color:#16a34a}.btn-sm{padding:.35rem .7rem;font-size:.78rem}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
th{background:#f8fafc;padding:.8rem 1rem;text-align:left;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
td{padding:.8rem 1rem;border-bottom:1px solid var(--border);font-size:.88rem}
.badge{padding:.2rem .6rem;border-radius:20px;font-size:.72rem;font-weight:700;text-transform:capitalize;background:#e2e8f0}
.badge.pending{background:#fef3c7;color:#92400e}.badge.confirmed{background:#dbeafe;color:#1e40af}.badge.completed{background:#dcfce7;color:#166534}.badge.cancelled{background:#fee2e2;color:#991b1b}
.card{background:#fff;border-radius:14px;padding:1.5rem;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.empty{text-align:center;padding:3rem;color:var(--muted);background:#fff;border-radius:14px}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;gap:1rem;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}.f{margin-bottom:1rem}.full{grid-column:1/-1}
label{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.35rem}
input,select,textarea{width:100%;padding:.6rem .8rem;border:1.5px solid var(--border);border-radius:9px;font:.9rem 'DM Sans',sans-serif;background:#fafbff}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue);background:#fff}input[readonly]{background:#f1f5f9;color:var(--muted)}
.days{display:flex;gap:.4rem;flex-wrap:wrap}.days label{display:flex;gap:.3rem;align-items:center;text-transform:none;font-size:.82rem;font-weight:600;letter-spacing:0;border:1.5px solid var(--border);border-radius:20px;padding:.3rem .75rem;cursor:pointer;margin:0}.days input{width:auto}
.msg{padding:.7rem 1rem;border-radius:10px;font-size:.86rem;margin-bottom:1rem}.msg.e{background:#fee2e2;color:#991b1b}.msg.s{background:#dcfce7;color:#166534}.msg.i{background:#eff6ff;color:#1e3a8a;border:1px solid #bfdbfe}
.modal{position:fixed;inset:0;background:rgba(10,22,40,.55);z-index:50;display:none;align-items:center;justify-content:center;padding:1rem}.modal.on{display:flex}
.mbox{background:#fff;border-radius:18px;padding:1.75rem;width:100%;max-width:680px;max-height:92vh;overflow-y:auto}
.mbox h3{margin-bottom:1.1rem}.medrow{display:grid;grid-template-columns:2fr 1fr 1.2fr 1fr auto;gap:.5rem;margin-bottom:.5rem}
@media(max-width:800px){.side{display:none}.g2{grid-template-columns:1fr}.medrow{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand"><div class="ic"><svg viewBox="0 0 64 64" style="width:100%;height:100%;display:block" role="img" aria-label="MediCare+ logo"><defs><linearGradient id="mcg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b3b91"/><stop offset=".55" stop-color="#1a56db"/><stop offset="1" stop-color="#0d9488"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#mcg)"/><path d="M26 13h12v13h13v12H38v13H26V38H13V26h13z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><polyline points="15,32 24,32 28,27.5 33,37 37,32 49,32" fill="none" stroke="#0d9488" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div><b>MediCare+</b><small>Doctor Portal</small></div></div>
    <div class="who"><b id="doc-name">Doctor</b><span id="doc-spec"></span></div>
    <nav>
      <div class="nl active" data-s="appointments" onclick="show('appointments')">📅 Appointments</div>
      <div class="nl" data-s="patients" onclick="show('patients')">👥 My Patients</div>
      <div class="nl" data-s="prescriptions" onclick="show('prescriptions')">💊 Prescriptions</div>
      <div class="nl" data-s="profile" onclick="show('profile')">👤 My Profile</div>
    </nav>
    <div class="out" onclick="logout()">🚪 Sign Out</div>
  </aside>
  <div class="main">
    <div class="top"><h2 id="title">Appointments</h2><a href="/" style="font-size:.85rem;color:var(--muted);text-decoration:none">← Back to website</a></div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="modal" id="rx-modal"><div class="mbox">
  <h3>💊 New prescription</h3><div id="rx-msg"></div>
  <div class="f"><label>Patient *</label><select id="rx-patient"></select></div>
  <div class="f"><label>Diagnosis *</label><input id="rx-diag" placeholder="e.g. Hypertension"></div>
  <label>Medicines *</label><div id="meds"></div>
  <button class="btn btn-sm" type="button" onclick="addMed()" style="margin-bottom:1rem">+ Add medicine</button>
  <div class="f"><label>Advice / instructions</label><textarea id="rx-inst" rows="3" placeholder="Diet, rest, warning signs…"></textarea></div>
  <div class="f"><label>Follow-up date</label><input id="rx-follow" type="date"></div>
  <div style="display:flex;gap:.6rem;justify-content:flex-end"><button class="btn" onclick="closeRx()">Cancel</button><button class="btn btn-p" id="rx-save" onclick="saveRx()">Save prescription</button></div>
</div></div>

<script>
let token = localStorage.getItem('token');
let me = JSON.parse(localStorage.getItem('user') || 'null');
if (!token || !me || me.role !== 'doctor') location.href = '/login';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const drName = n => { n = (n || '').trim(); return /^dr\.?\s/i.test(n) ? n : 'Dr. ' + n; };
let profile = null, appts = [];

async function call(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' } });
  if (res.status === 401) { logout(); return { ok: false, data: null }; }
  let data = null; try { data = await res.json(); } catch (e) {}
  return { ok: res.ok, status: res.status, data };
}
function logout() { localStorage.removeItem('token'); localStorage.removeItem('user'); location.href = '/login?switch=1'; }
const errText = d => typeof d?.detail === 'string' ? d.detail : (d?.detail?.[0]?.msg || 'Something went wrong.').replace(/^Value error, /, '');

async function init() {
  const r = await call('/api/doctors/me'); profile = r.data;
  $('doc-name').textContent = drName(profile?.user?.full_name || me.full_name);
  $('doc-spec').textContent = profile?.specialization || '';
  const a = await call('/api/appointments/'); appts = Array.isArray(a.data) ? a.data : [];
  show('appointments');
}

async function show(name) {
  document.querySelectorAll('.nl').forEach(l => l.classList.toggle('active', l.dataset.s === name));
  $('title').textContent = { appointments: 'Appointments', patients: 'My Patients', prescriptions: 'Prescriptions', profile: 'My Profile' }[name];
  const el = $('content');
  if (name !== 'profile' && name !== 'prescriptions') { const a = await call('/api/appointments/'); appts = Array.isArray(a.data) ? a.data : appts; }

  if (name === 'appointments') {
    el.innerHTML = !appts.length ? '<div class="empty">📅<p>No appointments yet</p></div>' :
    `<table><thead><tr><th>#</th><th>Patient</th><th>Date &amp; time</th><th>Reason</th><th>Status</th><th>Action</th></tr></thead><tbody>${
      appts.slice().sort((a, b) => new Date(b.appointment_date) - new Date(a.appointment_date)).map(a => `<tr>
        <td>${a.id}</td><td><b>${esc(a.patient_name || '#' + a.patient_id)}</b></td><td>${new Date(a.appointment_date).toLocaleString()}</td><td>${esc(a.reason || '-')}</td>
        <td><span class="badge ${a.status}">${a.status}</span></td>
        <td>${a.status === 'pending' ? `<button class="btn btn-sm btn-g" onclick="setStatus(${a.id},'confirmed')">Confirm</button> ` : ''}${a.status === 'confirmed' ? `<button class="btn btn-sm btn-p" onclick="setStatus(${a.id},'completed')">Complete</button> ` : ''}${a.status !== 'cancelled' ? `<button class="btn btn-sm" onclick="openRx(${a.patient_id})">Write Rx</button>` : ''}</td></tr>`).join('')}</tbody></table>`;
  }

  if (name === 'patients') {
    const map = {};
    appts.forEach(a => { const p = map[a.patient_id] ||= { id: a.patient_id, name: a.patient_name, visits: 0, last: null };
      p.visits++; if (!p.last || new Date(a.appointment_date) > new Date(p.last)) p.last = a.appointment_date; });
    const list = Object.values(map);
    el.innerHTML = !list.length ? '<div class="empty">👥<p>No patients yet</p></div>' :
    `<table><thead><tr><th>Patient</th><th>ID</th><th>Visits</th><th>Last visit</th><th></th></tr></thead><tbody>${list.map(p => `<tr>
      <td><b>${esc(p.name || 'Patient')}</b></td><td>#${p.id}</td><td>${p.visits}</td><td>${new Date(p.last).toLocaleDateString()}</td>
      <td><button class="btn btn-sm" onclick="openRx(${p.id})">Write Rx</button></td></tr>`).join('')}</tbody></table>`;
  }

  if (name === 'prescriptions') {
    const r = await call('/api/prescriptions/'); const rxs = Array.isArray(r.data) ? r.data : [];
    el.innerHTML = `<div class="row"><span style="color:var(--muted);font-size:.9rem">${rxs.length} prescription(s) written</span><button class="btn btn-p" onclick="openRx()">+ New prescription</button></div>` +
    (!rxs.length ? '<div class="empty">💊<p>No prescriptions yet</p></div>' :
    `<table><thead><tr><th>Rx No.</th><th>Patient</th><th>Diagnosis</th><th>Medicines</th><th>Date</th><th></th></tr></thead><tbody>${rxs.slice().reverse().map(x => `<tr>
      <td>RX-${String(x.id).padStart(5, '0')}</td><td><b>${esc(x.patient_name || '#' + x.patient_id)}</b></td><td>${esc(x.diagnosis || '-')}</td><td>${(x.medicines || []).length} item(s)</td>
      <td>${new Date(x.created_at).toLocaleDateString()}</td><td><button class="btn btn-sm btn-g" onclick="dlRx(${x.id})">⬇ PDF slip</button></td></tr>`).join('')}</tbody></table>`);
  }

  if (name === 'profile') renderProfile();
}

async function setStatus(id, status) { await call('/api/appointments/' + id, { method: 'PUT', body: JSON.stringify({ status }) }); show('appointments'); }

// ── prescriptions ──
function addMed(m = {}) {
  const d = document.createElement('div'); d.className = 'medrow';
  d.innerHTML = `<input placeholder="Medicine (e.g. Amlodipine 5mg)" value="${esc(m.name || '')}"><input placeholder="Dosage" value="${esc(m.dosage || '')}"><input placeholder="Frequency (e.g. twice daily)" value="${esc(m.frequency || '')}"><input placeholder="Duration" value="${esc(m.duration || '')}"><button class="btn btn-sm" type="button" onclick="this.parentNode.remove()">✕</button>`;
  $('meds').appendChild(d);
}
function openRx(patientId) {
  const seen = {}; appts.forEach(a => seen[a.patient_id] = a.patient_name || ('Patient #' + a.patient_id));
  $('rx-patient').innerHTML = Object.entries(seen).map(([id, n]) => `<option value="${id}" ${id == patientId ? 'selected' : ''}>${esc(n)} (#${id})</option>`).join('') || '<option value="">No patients yet</option>';
  $('rx-diag').value = ''; $('rx-inst').value = ''; $('rx-follow').value = ''; $('rx-msg').innerHTML = ''; $('meds').innerHTML = ''; addMed();
  $('rx-modal').classList.add('on');
}
function closeRx() { $('rx-modal').classList.remove('on'); }
async function saveRx() {
  const medicines = [...document.querySelectorAll('#meds .medrow')].map(r => { const i = r.querySelectorAll('input'); return { name: i[0].value.trim(), dosage: i[1].value.trim(), frequency: i[2].value.trim(), duration: i[3].value.trim() }; }).filter(m => m.name);
  if (!$('rx-patient').value) { $('rx-msg').innerHTML = '<div class="msg e">Choose a patient.</div>'; return; }
  if (!$('rx-diag').value.trim()) { $('rx-msg').innerHTML = '<div class="msg e">Please enter the diagnosis.</div>'; return; }
  if (!medicines.length) { $('rx-msg').innerHTML = '<div class="msg e">Add at least one medicine.</div>'; return; }
  if (medicines.some(m => !m.dosage || !m.frequency || !m.duration)) { $('rx-msg').innerHTML = '<div class="msg e">Fill dosage, frequency and duration for every medicine.</div>'; return; }
  const body = { patient_id: parseInt($('rx-patient').value), diagnosis: $('rx-diag').value.trim(), medicines, instructions: $('rx-inst').value.trim() || null, follow_up_date: $('rx-follow').value ? $('rx-follow').value + 'T09:00:00' : null };
  const b = $('rx-save'); b.disabled = true;
  const r = await call('/api/prescriptions/', { method: 'POST', body: JSON.stringify(body) });
  b.disabled = false;
  if (!r.ok) { $('rx-msg').innerHTML = `<div class="msg e">${esc(errText(r.data))}</div>`; return; }
  closeRx(); show('prescriptions'); dlRx(r.data.id);
}
async function dlRx(id) {
  const res = await fetch('/api/prescriptions/' + id + '/pdf', { headers: { 'Authorization': 'Bearer ' + token } });
  if (!res.ok) { alert('Could not download the prescription.'); return; }
  const url = URL.createObjectURL(await res.blob()); const a = document.createElement('a');
  a.href = url; a.download = 'prescription-RX-' + String(id).padStart(5, '0') + '.pdf'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ── my profile ──
const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
function renderProfile() {
  const p = profile || {}; const days = p.available_days || [];
  const incomplete = !p.bio || !p.qualification || !p.license_number;
  $('content').innerHTML = `<div class="card" style="max-width:820px">
    ${incomplete ? '<div class="msg i">Please complete your profile. Patients see your qualification, experience and biography on the hospital website, and your registration number is printed on your prescription slips.</div>' : ''}
    <div id="pr-msg"></div>
    <div class="g2">
      <div class="f"><label>Full name</label><input value="${esc(drName(p.user?.full_name))}" readonly></div>
      <div class="f"><label>Email</label><input value="${esc(p.user?.email)}" readonly></div>
      <div class="f"><label>Specialization *</label><input id="pr-spec" value="${esc(p.specialization)}" placeholder="e.g. Cardiologist"></div>
      <div class="f"><label>Qualification *</label><input id="pr-qual" value="${esc(p.qualification)}" placeholder="e.g. MBBS, FCPS (Cardiology)"></div>
      <div class="f"><label>Experience (years)</label><input id="pr-exp" type="number" min="0" max="70" value="${p.experience_years ?? 0}"></div>
      <div class="f"><label>Registration no. (PMDC) *</label><input id="pr-lic" value="${esc(p.license_number)}" placeholder="Printed on your prescriptions"></div>
      <div class="f"><label>Department</label><input value="${esc(p.department?.name || 'Not assigned')}" readonly></div>
      <div class="f"><label>Consultation fee</label><input value="$${Number(p.consultation_fee || 0).toFixed(2)}" readonly></div>
      <div class="f full"><label>About you (shown on the website)</label><textarea id="pr-bio" rows="4" placeholder="Areas of interest, approach to care, languages spoken…">${esc(p.bio)}</textarea></div>
      <div class="f full"><label>Available days</label><div class="days">${DAYS.map(d => `<label><input type="checkbox" value="${d}" ${days.includes(d) ? 'checked' : ''}> ${d.slice(0, 3)}</label>`).join('')}</div></div>
      <div class="f"><label>From</label><input id="pr-from" type="time" value="${esc(p.available_from || '09:00')}"></div>
      <div class="f"><label>To</label><input id="pr-to" type="time" value="${esc(p.available_to || '17:00')}"></div>
    </div>
    <p style="font-size:.78rem;color:var(--muted);margin-bottom:1rem">Fee and department are set by the hospital administration.</p>
    <button class="btn btn-p" id="pr-save" onclick="saveProfile()">Save profile</button></div>`;
}
async function saveProfile() {
  const body = { specialization: $('pr-spec').value.trim(), qualification: $('pr-qual').value.trim(), experience_years: parseInt($('pr-exp').value) || 0,
    license_number: $('pr-lic').value.trim(), bio: $('pr-bio').value.trim(), available_from: $('pr-from').value, available_to: $('pr-to').value,
    available_days: [...document.querySelectorAll('.days input:checked')].map(i => i.value) };
  if (!body.specialization || !body.qualification) { $('pr-msg').innerHTML = '<div class="msg e">Specialization and qualification are required.</div>'; return; }
  if (!body.available_days.length) { $('pr-msg').innerHTML = '<div class="msg e">Choose at least one available day.</div>'; return; }
  const r = await call('/api/doctors/' + profile.id, { method: 'PUT', body: JSON.stringify(body) });
  if (!r.ok) { $('pr-msg').innerHTML = `<div class="msg e">${esc(errText(r.data))}</div>`; return; }
  profile = r.data; $('doc-spec').textContent = profile.specialization || '';
  renderProfile(); $('pr-msg').innerHTML = '<div class="msg s">Profile saved. It is now live on the website.</div>';
}

init().then(() => { if (profile && (!profile.bio || !profile.qualification)) show('profile'); });
</script>
</body>
</html>
