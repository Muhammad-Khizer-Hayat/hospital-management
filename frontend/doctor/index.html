<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#0a1628">
<title>Doctor Portal – MediCare+</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#0a1628;--blue:#2563eb;--teal:#0d9488;--bg:#f1f5f9;--text:#1e293b;--muted:#64748b;--border:#e2e8f0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}
.layout{display:flex;min-height:100vh}
.side{width:250px;background:var(--navy);color:#fff;flex-shrink:0;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:.7rem;padding:1.4rem 1.4rem 1.2rem;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .ic{width:40px;height:40px;border-radius:11px;overflow:hidden;flex-shrink:0}
.brand b{font-family:'Playfair Display',serif;font-size:1.25rem;display:block;line-height:1.1}.brand small{font-size:.62rem;letter-spacing:.14em;color:#7f90ad;text-transform:uppercase}
.who{padding:1.1rem 1.4rem;border-bottom:1px solid rgba(255,255,255,.08)}.who b{display:block;font-size:.95rem}.who span{font-size:.78rem;color:#7f90ad}
nav{padding:.7rem 0;flex:1}
.nl{display:flex;gap:.8rem;align-items:center;padding:.75rem 1.4rem;color:#94a3b8;cursor:pointer;font-size:.9rem;font-weight:500;border-left:3px solid transparent}
.nl:hover{background:rgba(255,255,255,.05);color:#fff}.nl.active{background:rgba(37,99,235,.18);color:#93c5fd;border-left-color:#3b82f6}
.out{padding:1rem 1.4rem;border-top:1px solid rgba(255,255,255,.08);font-size:.85rem;color:#f87171;cursor:pointer}
.main{flex:1;min-width:0}
.top{background:#fff;padding:1rem 2rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.top h2{font-size:1.15rem}
.content{padding:1.75rem 2rem}
.btn{border:0;border-radius:9px;padding:.55rem 1rem;font:600 .85rem 'DM Sans',sans-serif;cursor:pointer;background:#fff;color:var(--text);border:1.5px solid var(--border)}
.btn:hover{border-color:var(--blue)}.btn-p{background:var(--blue);color:#fff;border-color:var(--blue)}.btn-g{background:#16a34a;color:#fff;border-color:#16a34a}.btn-sm{padding:.35rem .7rem;font-size:.78rem}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
th{background:#f8fafc;padding:.8rem 1rem;text-align:left;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
td{padding:.8rem 1rem;border-bottom:1px solid var(--border);font-size:.88rem}
.badge{padding:.2rem .6rem;border-radius:20px;font-size:.72rem;font-weight:700;text-transform:capitalize;background:#e2e8f0}
.badge.pending{background:#fef3c7;color:#92400e}.badge.confirmed{background:#dbeafe;color:#1e40af}.badge.completed{background:#dcfce7;color:#166534}.badge.cancelled{background:#fee2e2;color:#991b1b}
.card{background:#fff;border-radius:14px;padding:1.5rem;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.empty{text-align:center;padding:3rem;color:var(--muted);background:#fff;border-radius:14px}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;gap:1rem;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}.f{margin-bottom:1rem}.full{grid-column:1/-1}
label{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.35rem}
input,select,textarea{width:100%;padding:.6rem .8rem;border:1.5px solid var(--border);border-radius:9px;font:.9rem 'DM Sans',sans-serif;background:#fafbff}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue);background:#fff}input[readonly]{background:#f1f5f9;color:var(--muted)}
.days{display:flex;gap:.4rem;flex-wrap:wrap}.days label{display:flex;gap:.3rem;align-items:center;text-transform:none;font-size:.82rem;font-weight:600;letter-spacing:0;border:1.5px solid var(--border);border-radius:20px;padding:.3rem .75rem;cursor:pointer;margin:0}.days input{width:auto}
.msg{padding:.7rem 1rem;border-radius:10px;font-size:.86rem;margin-bottom:1rem}.msg.e{background:#fee2e2;color:#991b1b}.msg.s{background:#dcfce7;color:#166534}.msg.i{background:#eff6ff;color:#1e3a8a;border:1px solid #bfdbfe}
.modal{position:fixed;inset:0;background:rgba(10,22,40,.55);z-index:50;display:none;align-items:center;justify-content:center;padding:1rem}.modal.on{display:flex}
.mbox{background:#fff;border-radius:18px;padding:1.75rem;width:100%;max-width:680px;max-height:92vh;overflow-y:auto}
.mbox h3{margin-bottom:1.1rem}.medrow{display:grid;grid-template-columns:2fr 1fr 1.2fr 1fr auto;gap:.5rem;margin-bottom:.5rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.5rem}.stat{background:#fff;border-radius:14px;padding:1.1rem 1.25rem;box-shadow:0 1px 4px rgba(0,0,0,.06)}.stat b{display:block;font-size:1.7rem;font-family:'Playfair Display',serif;color:var(--navy)}.stat span{font-size:.78rem;color:var(--muted)}
.chips{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap}.chip{padding:.4rem .95rem;border-radius:20px;border:1.5px solid var(--border);background:#fff;font:600 .82rem 'DM Sans',sans-serif;cursor:pointer}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
tr.click{cursor:pointer}tr.click:hover td{background:#f8fbff}.tok{display:inline-block;min-width:28px;text-align:center;background:#e0e7ff;color:#3730a3;border-radius:8px;padding:.15rem .4rem;font-weight:700;font-size:.8rem}
.tag{display:inline-block;background:#fef3c7;color:#92400e;border-radius:6px;padding:.1rem .45rem;font-size:.7rem;font-weight:700;margin-left:.35rem}
.consult{display:grid;grid-template-columns:320px 1fr;gap:1.25rem;align-items:start}.kv{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 0;border-bottom:1px solid var(--border);font-size:.86rem}.kv span{color:var(--muted)}.kv b{text-align:right}
.avatar{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#1a56db,#0d9488);color:#fff;display:flex;align-items:center;justify-content:center;font:700 1.9rem 'DM Sans',sans-serif}
@media(max-width:1000px){.consult{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
@media(max-width:800px){.side{display:none}.g2{grid-template-columns:1fr}.medrow{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand"><div class="ic"><svg viewBox="0 0 64 64" style="width:100%;height:100%;display:block" role="img" aria-label="MediCare+ logo"><defs><linearGradient id="mcg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b3b91"/><stop offset=".55" stop-color="#1a56db"/><stop offset="1" stop-color="#0d9488"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#mcg)"/><path d="M26 13h12v13h13v12H38v13H26V38H13V26h13z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><polyline points="15,32 24,32 28,27.5 33,37 37,32 49,32" fill="none" stroke="#0d9488" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div><b>MediCare+</b><small>Doctor Portal</small></div></div>
    <div class="who"><b id="doc-name">Doctor</b><span id="doc-spec"></span></div>
    <nav>
      <div class="nl active" data-s="dashboard" onclick="show('dashboard')">🏠 Dashboard</div>
      <div class="nl" data-s="appointments" onclick="show('appointments')">📅 Appointments</div>
      <div class="nl" data-s="patients" onclick="show('patients')">👥 My Patients</div>
      <div class="nl" data-s="prescriptions" onclick="show('prescriptions')">💊 Prescriptions</div>
      <div class="nl" data-s="profile" onclick="show('profile')">👤 My Profile</div>
    </nav>
    <div class="out" onclick="logout()">🚪 Sign Out</div>
  </aside>
  <div class="main">
    <div class="top"><h2 id="title">Appointments</h2><a href="/" style="font-size:.85rem;color:var(--muted);text-decoration:none">← Back to website</a></div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
let token = localStorage.getItem('token');
let me = JSON.parse(localStorage.getItem('user') || 'null');
if (!token || !me || me.role !== 'doctor') location.href = '/doctor/login';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const drName = n => { n = (n || '').trim(); return /^dr\.?\s/i.test(n) ? n : 'Dr. ' + n; };
const ymd = d => { d = new Date(d); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const hm = d => new Date(d).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
let profile = null, appts = [], filter = 'today', current = null;

async function call(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' } });
  if (res.status === 401) { logout(); return { ok: false, data: null }; }
  let data = null; try { data = await res.json(); } catch (e) {}
  return { ok: res.ok, status: res.status, data };
}
function logout() { localStorage.removeItem('token'); localStorage.removeItem('user'); location.href = '/doctor/login?switch=1'; }
const errText = d => typeof d?.detail === 'string' ? d.detail : (d?.detail?.[0]?.msg || 'Something went wrong.').replace(/^Value error, /, '');
const who = a => esc(a.patient_name || 'Patient') + (a.booked_for_name ? `<span class="tag">${esc(a.booked_for_relation)} of ${esc(a.account_name)}</span>` : '');

async function loadAppts() { const a = await call('/api/appointments/?limit=500'); appts = Array.isArray(a.data) ? a.data : appts; }
async function init() {
  profile = (await call('/api/doctors/me')).data;
  $('doc-name').textContent = drName(profile?.user?.full_name || me.full_name);
  $('doc-spec').textContent = profile?.specialization || '';
  await loadAppts();
  if (profile && (!profile.bio || !profile.qualification)) show('profile'); else show('dashboard');
}

async function show(name) {
  document.querySelectorAll('.nl').forEach(l => l.classList.toggle('active', l.dataset.s === name));
  $('title').textContent = { dashboard: 'Dashboard', appointments: 'Appointments', patients: 'My Patients', prescriptions: 'Prescriptions', profile: 'My Profile' }[name];
  if (name !== 'profile' && name !== 'prescriptions') await loadAppts();
  const el = $('content'), today = ymd(new Date());

  if (name === 'dashboard') {
    const t = appts.filter(a => ymd(a.appointment_date) === today && a.status !== 'cancelled');
    const open = appts.filter(a => a.status === 'pending' || a.status === 'confirmed');
    el.innerHTML = `<div class="stats">
      <div class="stat"><b>${t.length}</b><span>Today's appointments</span></div>
      <div class="stat"><b>${open.length}</b><span>Waiting to be seen</span></div>
      <div class="stat"><b>${t.filter(a => a.status === 'completed').length}</b><span>Completed today</span></div>
      <div class="stat"><b>${new Set(appts.map(a => a.patient_name)).size}</b><span>Patients</span></div></div>
      <div class="row"><h3>Today's queue</h3><button class="btn btn-sm" onclick="show('appointments')">All appointments →</button></div>${apptTable(t.sort((a, b) => new Date(a.appointment_date) - new Date(b.appointment_date)), 'No appointments today. Booked appointments appear here automatically.')}`;
  }

  if (name === 'appointments') {
    const chips = [['today', 'Today'], ['upcoming', 'Upcoming'], ['pending', 'Waiting'], ['completed', 'Completed'], ['all', 'All']];
    const f = { today: a => ymd(a.appointment_date) === today, upcoming: a => ymd(a.appointment_date) > today, pending: a => ['pending', 'confirmed'].includes(a.status), completed: a => a.status === 'completed', all: () => true }[filter];
    const list = appts.filter(f).sort((a, b) => filter === 'completed' || filter === 'all' ? new Date(b.appointment_date) - new Date(a.appointment_date) : new Date(a.appointment_date) - new Date(b.appointment_date));
    el.innerHTML = `<div class="chips">${chips.map(([k, l]) => `<button class="chip ${filter === k ? 'on' : ''}" onclick="filter='${k}';show('appointments')">${l}</button>`).join('')}</div>` + apptTable(list, 'No appointments here.');
  }

  if (name === 'patients') {
    const map = {};
    appts.forEach(a => { const k = (a.booked_for_name ? 'b:' + a.booked_for_name + a.patient_id : 'p:' + a.patient_id); const p = map[k] ||= { name: a.patient_name, rel: a.booked_for_relation ? a.booked_for_relation + ' of ' + a.account_name : '', visits: 0, last: null, first: a.id };
      p.visits++; if (!p.last || new Date(a.appointment_date) > new Date(p.last)) p.last = a.appointment_date; });
    const list = Object.values(map);
    el.innerHTML = !list.length ? '<div class="empty">👥<p>No patients yet</p></div>' : `<table><thead><tr><th>Patient</th><th>Visits</th><th>Last visit</th></tr></thead><tbody>${list.map(p => `<tr><td><b>${esc(p.name)}</b> ${p.rel ? `<span class="tag">${esc(p.rel)}</span>` : ''}</td><td>${p.visits}</td><td>${new Date(p.last).toLocaleDateString()}</td></tr>`).join('')}</tbody></table>`;
  }

  if (name === 'prescriptions') {
    const r = await call('/api/prescriptions/'); const rxs = Array.isArray(r.data) ? r.data : [];
    el.innerHTML = `<p style="color:var(--muted);font-size:.9rem;margin-bottom:1rem">${rxs.length} prescription(s). To write a new one, open an appointment and press “Start consultation”.</p>` +
      (!rxs.length ? '<div class="empty">💊<p>No prescriptions yet</p></div>' :
      `<table><thead><tr><th>Rx No.</th><th>Patient</th><th>Diagnosis</th><th>Medicines</th><th>Date</th><th></th></tr></thead><tbody>${rxs.slice().reverse().map(x => `<tr>
        <td>RX-${String(x.id).padStart(5, '0')}</td><td><b>${esc(x.patient_name || '#' + x.patient_id)}</b></td><td>${esc(x.diagnosis || '-')}</td><td>${(x.medicines || []).length} item(s)</td>
        <td>${new Date(x.created_at).toLocaleDateString()}</td><td><button class="btn btn-sm btn-g" onclick="dlRx(${x.id})">⬇ PDF slip</button></td></tr>`).join('')}</tbody></table>`);
  }
  if (name === 'profile') renderProfile(false);
}

function apptTable(list, emptyText) {
  if (!list.length) return `<div class="empty">📅<p>${emptyText}</p></div>`;
  return `<table><thead><tr><th>Token</th><th>Time</th><th>Patient</th><th>Reason</th><th>Status</th><th></th></tr></thead><tbody>${list.map(a => `<tr class="click" onclick="openConsult(${a.id})">
    <td><span class="tok">${a.token_no ?? '-'}</span></td><td>${new Date(a.appointment_date).toLocaleDateString([], { day: '2-digit', month: 'short' })}, ${hm(a.appointment_date)}</td>
    <td><b>${who(a)}</b>${a.source === 'walk_in' ? '<span class="tag" style="background:#dbeafe;color:#1e40af">Walk-in</span>' : ''}</td><td>${esc(a.reason || '-')}</td><td><span class="badge ${a.status}">${a.status.replace('_', ' ')}</span></td>
    <td><button class="btn btn-sm ${a.status === 'completed' ? '' : 'btn-p'}">${a.status === 'completed' ? 'View' : 'Open'}</button></td></tr>`).join('')}</tbody></table>`;
}

// ───────── Consultation: patient details + prescription slip ─────────
async function openConsult(id, notice) {
  const r = await call('/api/appointments/' + id); if (!r.ok) return;
  const a = current = r.data; $('title').textContent = 'Consultation';
  document.querySelectorAll('.nl').forEach(l => l.classList.toggle('active', l.dataset.s === 'appointments'));
  let pat = null;
  if (!a.booked_for_name) { const p = await call('/api/patients/' + a.patient_id); pat = p.ok ? p.data : null; }
  const age = a.booked_for_name ? a.booked_for_age + ' yrs' : (pat?.date_of_birth ? Math.floor((Date.now() - new Date(pat.date_of_birth)) / 31557600000) + ' yrs' : '-');
  const gender = a.booked_for_name ? a.booked_for_gender : pat?.gender;
  let rx = null; if (a.prescription_id) rx = (await call('/api/prescriptions/' + a.prescription_id)).data;
  const done = a.status === 'completed', cancelled = a.status === 'cancelled';
  $('content').innerHTML = `<button class="btn btn-sm" onclick="show('appointments')" style="margin-bottom:1rem">← Back to appointments</button>
  ${notice ? `<div class="msg s">${notice}</div>` : ''}
  <div class="consult">
    <div class="card"><div style="display:flex;gap:1rem;align-items:center;margin-bottom:1rem"><div class="avatar" style="width:56px;height:56px;font-size:1.2rem">${esc((a.patient_name || '?').split(' ').map(x => x[0]).slice(0, 2).join('').toUpperCase())}</div>
      <div><b style="font-size:1.05rem">${esc(a.patient_name)}</b><br><span class="badge ${a.status}">${a.status.replace('_', ' ')}</span></div></div>
      ${a.booked_for_name ? `<div class="msg i" style="font-size:.8rem">Booked by <b>${esc(a.account_name)}</b> for their <b>${esc(a.booked_for_relation.toLowerCase())}</b>.</div>` : ''}
      <div class="kv"><span>Token</span><b>#${a.token_no ?? '-'}</b></div>
      <div class="kv"><span>Date &amp; time</span><b>${new Date(a.appointment_date).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}</b></div>
      <div class="kv"><span>Age / gender</span><b>${esc(age)}${gender ? ' / ' + esc(gender) : ''}</b></div>
      <div class="kv"><span>Phone</span><b>${esc(a.patient_phone || '-')}</b></div>
      ${pat ? `<div class="kv"><span>Blood group</span><b>${esc(pat.blood_group || '-')}</b></div>
      <div class="kv"><span>Allergies</span><b style="color:${pat.allergies ? '#b91c1c' : 'inherit'}">${esc(pat.allergies || 'None reported')}</b></div>
      <div class="kv"><span>Conditions</span><b>${esc(pat.chronic_conditions || '-')}</b></div>` : ''}
      <div class="kv"><span>Reason for visit</span><b>${esc(a.reason || '-')}</b></div>
      <div class="kv"><span>Source</span><b>${a.source === 'walk_in' ? 'Walk-in (front desk)' : 'Online booking'}</b></div>
      <div class="kv"><span>Fee</span><b>$${Number(a.amount || 0).toFixed(2)} · ${esc(a.payment_status || '-')}</b></div>
      ${a.status === 'pending' ? `<button class="btn btn-g" style="width:100%;margin-top:1rem" onclick="setStatus(${a.id},'confirmed')">Confirm appointment</button>` : ''}
      ${!done && !cancelled ? `<button class="btn" style="width:100%;margin-top:.5rem" onclick="setStatus(${a.id},'no_show')">Mark as no-show</button>` : ''}
    </div>
    <div class="card" id="rx-card">${rx ? rxView(rx) : (cancelled || a.status === 'no_show' ? '<div class="empty" style="background:none">This appointment is ' + a.status.replace('_', ' ') + '.</div>' : rxForm())}</div>
  </div>`;
  if (!rx && !cancelled && a.status !== 'no_show') { $('meds').innerHTML = ''; addMed(); }
}
function rxView(x) {
  return `<div class="row"><h3>💊 Prescription RX-${String(x.id).padStart(5, '0')}</h3><button class="btn btn-g" onclick="dlRx(${x.id})">⬇ Download slip (PDF)</button></div>
  <div class="msg s">Visit completed. The patient can now see this prescription and the completed status in their portal.</div>
  <div class="kv"><span>Diagnosis</span><b>${esc(x.diagnosis)}</b></div>
  <table style="margin:1rem 0;box-shadow:none;border:1px solid var(--border)"><thead><tr><th>Medicine</th><th>Dosage</th><th>Frequency</th><th>Duration</th></tr></thead><tbody>${(x.medicines || []).map(m => `<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.dosage)}</td><td>${esc(m.frequency)}</td><td>${esc(m.duration)}</td></tr>`).join('')}</tbody></table>
  ${x.instructions ? `<p style="font-size:.9rem"><b>Advice:</b> ${esc(x.instructions)}</p>` : ''}${x.follow_up_date ? `<p style="font-size:.85rem;color:var(--muted);margin-top:.4rem">Follow-up: ${new Date(x.follow_up_date).toLocaleDateString()}</p>` : ''}`;
}
function rxForm() {
  return `<h3 style="margin-bottom:1rem">💊 Prescription slip</h3><div id="rx-msg"></div>
  <div class="f"><label>Diagnosis *</label><input id="rx-diag" placeholder="e.g. Viral fever"></div>
  <label>Medicines *</label><div id="meds"></div>
  <button class="btn btn-sm" type="button" onclick="addMed()" style="margin-bottom:1rem">+ Add medicine</button>
  <div class="f"><label>Advice / instructions</label><textarea id="rx-inst" rows="3" placeholder="Diet, rest, warning signs…"></textarea></div>
  <div class="f" style="max-width:240px"><label>Follow-up date</label><input id="rx-follow" type="date"></div>
  <button class="btn btn-p" id="rx-save" onclick="saveRx()" style="padding:.75rem 1.4rem">✔ Save prescription &amp; complete visit</button>`;
}
function addMed(m = {}) {
  const d = document.createElement('div'); d.className = 'medrow';
  d.innerHTML = `<input placeholder="Medicine (e.g. Amlodipine 5mg)" value="${esc(m.name || '')}"><input placeholder="Dosage" value="${esc(m.dosage || '')}"><input placeholder="Frequency (e.g. twice daily)" value="${esc(m.frequency || '')}"><input placeholder="Duration" value="${esc(m.duration || '')}"><button class="btn btn-sm" type="button" onclick="this.parentNode.remove()">✕</button>`;
  $('meds').appendChild(d);
}
async function saveRx() {
  const medicines = [...document.querySelectorAll('#meds .medrow')].map(r => { const i = r.querySelectorAll('input'); return { name: i[0].value.trim(), dosage: i[1].value.trim(), frequency: i[2].value.trim(), duration: i[3].value.trim() }; }).filter(m => m.name);
  const bad = t => { $('rx-msg').innerHTML = `<div class="msg e">${t}</div>`; };
  if (!$('rx-diag').value.trim()) return bad('Please enter the diagnosis.');
  if (!medicines.length) return bad('Add at least one medicine.');
  if (medicines.some(m => !m.dosage || !m.frequency || !m.duration)) return bad('Fill dosage, frequency and duration for every medicine.');
  const body = { appointment_id: current.id, diagnosis: $('rx-diag').value.trim(), medicines, instructions: $('rx-inst').value.trim() || null, follow_up_date: $('rx-follow').value ? $('rx-follow').value + 'T09:00:00' : null };
  const b = $('rx-save'); b.disabled = true; b.textContent = 'Saving…';
  const r = await call('/api/prescriptions/', { method: 'POST', body: JSON.stringify(body) });
  if (!r.ok) { b.disabled = false; b.textContent = '✔ Save prescription & complete visit'; return bad(esc(errText(r.data))); }
  openConsult(current.id, 'Prescription saved and the appointment is marked completed.');
}
async function setStatus(id, status) { await call('/api/appointments/' + id, { method: 'PUT', body: JSON.stringify({ status }) }); openConsult(id); }
async function dlRx(id) {
  const res = await fetch('/api/prescriptions/' + id + '/pdf', { headers: { 'Authorization': 'Bearer ' + token } });
  if (!res.ok) { alert('Could not download the prescription.'); return; }
  const url = URL.createObjectURL(await res.blob()); const a = document.createElement('a');
  a.href = url; a.download = 'prescription-RX-' + String(id).padStart(5, '0') + '.pdf'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ───────── My profile: view, then edit ─────────
const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
function renderProfile(edit, notice) {
  const p = profile || {}, days = p.available_days || [], nm = p.user?.full_name || '';
  const incomplete = !p.bio || !p.qualification || !p.license_number;
  if (!edit) {
    $('content').innerHTML = `<div class="card" style="max-width:860px">
      ${notice ? `<div class="msg s">${notice}</div>` : ''}${incomplete ? '<div class="msg i">Your profile is incomplete. Patients see it on the hospital website, and your registration number is printed on prescription slips. Press “Edit profile” to complete it.</div>' : ''}
      <div style="display:flex;gap:1.25rem;align-items:center;margin-bottom:1.25rem;flex-wrap:wrap"><div class="avatar">${esc(nm.replace(/^dr\.?\s+/i, '').split(' ').map(x => x[0]).slice(0, 2).join('').toUpperCase())}</div>
        <div style="flex:1"><h2 style="font-family:'Playfair Display',serif">${esc(drName(nm))}</h2><div style="color:var(--teal);font-weight:600">${esc(p.specialization || 'Specialization not set')}</div><div style="color:var(--muted);font-size:.85rem">${esc(p.department?.name || 'No department')} · ${esc(p.user?.email)}</div></div>
        <button class="btn btn-p" onclick="renderProfile(true)">✎ Edit profile</button></div>
      <div class="g2">
        <div class="kv"><span>Qualification</span><b>${esc(p.qualification || '—')}</b></div><div class="kv"><span>Experience</span><b>${p.experience_years ?? 0} years</b></div>
        <div class="kv"><span>Registration no. (PMDC)</span><b>${esc(p.license_number || '—')}</b></div><div class="kv"><span>Consultation fee</span><b>$${Number(p.consultation_fee || 0).toFixed(2)}</b></div>
        <div class="kv"><span>Available days</span><b>${days.map(d => d.slice(0, 3)).join(', ') || '—'}</b></div><div class="kv"><span>Timings</span><b>${esc(p.available_from || '')} – ${esc(p.available_to || '')}</b></div>
      </div>
      <h4 style="margin:1.25rem 0 .4rem">About</h4><p style="color:var(--muted);line-height:1.7;font-size:.92rem">${esc(p.bio || 'No biography yet.')}</p></div>`;
    return;
  }
  $('content').innerHTML = `<div class="card" style="max-width:860px"><div id="pr-msg"></div>
    <div class="g2">
      <div class="f"><label>Full name</label><input value="${esc(drName(nm))}" readonly></div><div class="f"><label>Email</label><input value="${esc(p.user?.email)}" readonly></div>
      <div class="f"><label>Specialization *</label><input id="pr-spec" value="${esc(p.specialization)}" placeholder="e.g. Cardiologist"></div>
      <div class="f"><label>Qualification *</label><input id="pr-qual" value="${esc(p.qualification)}" placeholder="e.g. MBBS, FCPS (Cardiology)"></div>
      <div class="f"><label>Experience (years)</label><input id="pr-exp" type="number" min="0" max="70" value="${p.experience_years ?? 0}"></div>
      <div class="f"><label>Registration no. (PMDC) *</label><input id="pr-lic" value="${esc(p.license_number)}" placeholder="Printed on your prescriptions"></div>
      <div class="f"><label>Department</label><input value="${esc(p.department?.name || 'Not assigned')}" readonly></div><div class="f"><label>Consultation fee</label><input value="$${Number(p.consultation_fee || 0).toFixed(2)}" readonly></div>
      <div class="f full"><label>About you (shown on the website)</label><textarea id="pr-bio" rows="4" placeholder="Areas of interest, approach to care, languages spoken…">${esc(p.bio)}</textarea></div>
      <div class="f full"><label>Available days</label><div class="days">${DAYS.map(d => `<label><input type="checkbox" value="${d}" ${days.includes(d) ? 'checked' : ''}> ${d.slice(0, 3)}</label>`).join('')}</div></div>
      <div class="f"><label>From</label><input id="pr-from" type="time" value="${esc(p.available_from || '09:00')}"></div><div class="f"><label>To</label><input id="pr-to" type="time" value="${esc(p.available_to || '17:00')}"></div>
    </div><p style="font-size:.78rem;color:var(--muted);margin-bottom:1rem">Fee and department are set by the hospital administration.</p>
    <div style="display:flex;gap:.6rem"><button class="btn btn-p" id="pr-save" onclick="saveProfile()">Save profile</button><button class="btn" onclick="renderProfile(false)">Cancel</button></div></div>`;
}
async function saveProfile() {
  const body = { specialization: $('pr-spec').value.trim(), qualification: $('pr-qual').value.trim(), experience_years: parseInt($('pr-exp').value) || 0,
    license_number: $('pr-lic').value.trim(), bio: $('pr-bio').value.trim(), available_from: $('pr-from').value, available_to: $('pr-to').value,
    available_days: [...document.querySelectorAll('.days input:checked')].map(i => i.value) };
  const bad = t => { $('pr-msg').innerHTML = `<div class="msg e">${t}</div>`; };
  if (!body.specialization || !body.qualification) return bad('Specialization and qualification are required.');
  if (!body.available_days.length) return bad('Choose at least one available day.');
  const r = await call('/api/doctors/' + profile.id, { method: 'PUT', body: JSON.stringify(body) });
  if (!r.ok) return bad(esc(errText(r.data)));
  profile = r.data; $('doc-spec').textContent = profile.specialization || '';
  renderProfile(false, 'Profile saved. It is now live on the hospital website.');
}
init();
